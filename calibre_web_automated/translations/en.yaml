configuration:
  books_dir:
    name: Books Directory
    description: >-
      Path under /share where your Calibre library lives. The folder is created
      automatically on first start. After starting, open the CWA web UI and set
      the Calibre library location to this same path.
      Default: /share/calibre/books
  ingest_dir:
    name: Ingest Directory
    description: >-
      Drop new ebooks here. A background process moves them into CWA's ingest
      queue every few seconds so they are imported automatically.
      Default: /share/calibre/ingest
  PUID:
    name: User ID (PUID)
    description: >-
      Unix user ID the application runs as. Run 'id' in a terminal to find yours.
  PGID:
    name: Group ID (PGID)
    description: >-
      Unix group ID the application runs as. Run 'id' in a terminal to find yours.
  TZ:
    name: Timezone
    description: >-
      IANA timezone string, e.g. America/New_York or Europe/London.
      Full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
